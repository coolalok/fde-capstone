name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch first: the default Linux wheel pulls the CUDA
          # stack (several GB) and the runner runs out of disk.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Lint
        run: python -m flake8 src/ tests/ evaluation/

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing
